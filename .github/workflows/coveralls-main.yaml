name: Coveralls Main

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coveralls-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coveralls:
    name: Build main coverage baseline
    uses: CCPBioSim/.github/.github/workflows/ci-test-conda.yaml@032ccd9e849d9a57dee16beb835b90e53de9c981 # 0.7.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: aiida_gromacs
      matrix: >-
        {
          "python": ["3.12", "3.13", "3.14"],
          "aiida": ["2.9.0", "2.9.1"],
          "gromacs": ["2026.3"],
          "plumed": ["2.10.1"]
        }
      conda-packages: python={python} aiida-core={aiida} gromacs={gromacs}=nompi_* plumed={plumed}=mpi_nompi_*
      pre-test-command: |
        export PLUMED_KERNEL="${CONDA_PREFIX}/lib/libplumedKernel.so"
        ls -l "${PLUMED_KERNEL}"
        which gmx
      pytest-args: -s
      test-path: .
      coverage-leg: '{"python": "3.14", "aiida": "2.9.1"}'
      timeout-minutes: 30
