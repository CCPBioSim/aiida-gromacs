name: Weekly Unit Tests

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    uses: CCPBioSim/.github/.github/workflows/ci-test-conda.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: aiida_gromacs
      conda-packages: gromacs=2026.3=nompi_* plumed=2.10.1=mpi_nompi_*
      pre-test-command: |
        export PLUMED_KERNEL="${CONDA_PREFIX}/lib/libplumedKernel.so"
        ls -l "${PLUMED_KERNEL}"
        which gmx
      pytest-args: -s
      test-path: .
      lowest-dependencies-check: true
      timeout-minutes: 30
