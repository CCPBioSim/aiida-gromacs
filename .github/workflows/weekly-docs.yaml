name: Weekly Docs Build

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs build
    uses: CCPBioSim/.github/.github/workflows/ci-docs.yaml@edc3732fa8d31a58312ca784e65cad9bdfba9347 # 0.13.0
    permissions:
      contents: read
    with:
      python-versions: '["3.12", "3.13", "3.14"]'
      build-dir: build
      timeout-minutes: 30
