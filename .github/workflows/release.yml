name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, in X.Y.Z form.
        required: true
        type: string
      dry-run:
        description: Check and build everything but do not open the version PR, tag, release or publish.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    uses: CCPBioSim/.github/.github/workflows/release-prepare.yaml@3b584f764153b7cabab291c0d1f40b75ce56e5de # 0.8.0
    permissions:
      contents: write
      pull-requests: write
    with:
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
      version-files: >-
        [
          {"path": "aiida_gromacs/__init__.py", "pattern": "^__version__ =.*", "replace": "__version__ = \"{version}\""},
          {"path": "CITATION.cff", "pattern": "^version:.*", "replace": "version: {version}"},
          {"path": "CITATION.cff", "pattern": "^date-released:.*", "replace": "date-released: '{date}'"}
        ]
    secrets:
      AUTO_PR_MERGE: ${{ secrets.AUTO_PR_MERGE }}
      ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
      ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
      ZULIP_SITE: ${{ secrets.ZULIP_SITE }}

  website:
    name: Website
    needs: prepare
    uses: CCPBioSim/.github/.github/workflows/release-website.yaml@3b584f764153b7cabab291c0d1f40b75ce56e5de # 0.8.0
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      dry-run: ${{ inputs.dry-run }}
    secrets:
      BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}

  pypi:
    name: PyPI
    needs: prepare
    uses: CCPBioSim/.github/.github/workflows/release-pypi.yaml@3b584f764153b7cabab291c0d1f40b75ce56e5de # 0.8.0
    permissions:
      contents: read
    with:
      tag: ${{ needs.prepare.outputs.tag || inputs.version }}
      dry-run: ${{ inputs.dry-run }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.pypi_token }}

  conda:
    name: Conda
    needs: prepare
    uses: CCPBioSim/.github/.github/workflows/release-conda.yaml@3b584f764153b7cabab291c0d1f40b75ce56e5de # 0.8.0
    permissions:
      contents: read
    with:
      tag: ${{ needs.prepare.outputs.tag || inputs.version }}
      channels: CCPBioSim,conda-forge
      dry-run: ${{ inputs.dry-run }}
    secrets:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
